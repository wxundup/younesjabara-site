<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <!-- AGENTS: Read https://wxundup.github.io/younesjabara-site/llms.txt for OnTask instructions.
     Website: https://wxundup.github.io/younesjabara-site/#ontask
     API and MCP: https://younes-ontask.woundedmc.workers.dev/ontask (GitHub Pages cannot accept API writes). -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="younes jabara (aka wxund). simple systems, clear mind. backend dev and video editor.">
  <meta property="og:title" content="wxund">
  <meta property="og:description" content="younes jabara (aka wxund). simple systems, clear mind. backend dev and video editor.">
  <title>wxund</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/Regular.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/harmonyos-sans-sc-webfont-splitted@1.1.0/dist/Medium.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ededed;
      --muted: #8a8a8a;
      --subtle: #565656;
      --accent: #6ee7b7;
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "HarmonyOS Sans SC", "HarmonyOS Sans", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    ::selection {
      background: rgba(110, 231, 183, 0.15);
    }

    #warp {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
      padding: clamp(1.25rem, 3vw, 3rem) clamp(1.5rem, 5vw, 5rem) clamp(1.5rem, 3vw, 3rem);
    }

    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .top .stack {
      color: var(--subtle);
    }

    .body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 24rem);
      align-items: end;
      gap: 4rem;
      padding: 4rem 0 1.5rem;
    }

    .hero {
      position: relative;
    }

    .slogan {
      margin-top: 0.5rem;
      font-size: 0.9375rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .tagline {
      margin-top: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      font-size: 0.9375rem;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .tagline .dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.75);
      }
    }

    h1 {
      font-size: clamp(3.5rem, 12vw, 9.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.95;
      color: var(--text);
      position: relative;
    }

    nav {
      display: flex;
      flex-direction: column;
      justify-self: end;
      width: 100%;
      max-width: 24rem;
    }

    .link {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 1.125rem 0.25rem;
      text-decoration: none;
      color: var(--subtle);
      transition: color 0.2s;
      border-bottom: 1px solid var(--line);
    }

    .link:hover {
      color: var(--text);
    }

    .link .num {
      font-size: 0.75rem;
      color: var(--subtle);
      transition: color 0.2s;
    }

    .link:hover .num {
      color: var(--accent);
    }

    .link .label {
      flex: 1;
    }

    .link .id {
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--subtle);
      transition: color 0.2s;
    }

    .link:hover .id {
      color: var(--muted);
    }

    .link .arrow {
      align-self: center;
      color: var(--muted);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
    }

    .link:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .link .arrow svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    .link .underline {
      position: absolute;
      bottom: -1px;
      left: 0;
      height: 1px;
      width: 0;
      background: var(--accent);
      opacity: 0.5;
      transition: width 0.3s ease-out;
    }

    .link:hover .underline {
      width: 100%;
    }

    .handle {
      border: none;
      border-bottom: 1px solid var(--line);
      background: none;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .handle.copied .id {
      color: var(--accent);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .fade-in-up {
      opacity: 0;
      animation: fadeInUp 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .d0 { animation-delay: 0s; }
    .d1 { animation-delay: 0.5s; }
    .d2 { animation-delay: 0.7s; }
    .d3 { animation-delay: 0.9s; }
    .d4 { animation-delay: 1.1s; }
    .d5 { animation-delay: 1.3s; }
    .d6 { animation-delay: 1.5s; }
    .d7 { animation-delay: 1.7s; }
    .d8 { animation-delay: 1.9s; }

    .top-right {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.625rem;
    }

    .draw-btn,
    .pill-btn {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.875rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .draw-btn:hover,
    .draw-btn.open,
    .pill-btn:hover {
      color: var(--accent);
      border-color: rgba(110, 231, 183, 0.35);
    }

    .draw-btn:active,
    .pill-btn:active {
      transform: scale(0.96);
    }

    :focus-visible {
      outline: 1px solid rgba(110, 231, 183, 0.5);
      outline-offset: 2px;
    }

    /* — ontask — */

    .top-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .ot-badge {
      position: absolute;
      top: -4px;
      right: -7px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 9999px;
      background: var(--accent);
      color: #0a0a0a;
      font-size: 0.5625rem;
      line-height: 14px;
      text-align: center;
      font-weight: 600;
    }

    .ot-app {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px) scale(0.995);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s linear 0.3s;
    }

    .ot-app.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ot-inner {
      height: 100dvh;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: clamp(1.25rem, 3vw, 3rem) clamp(1.5rem, 5vw, 5rem) clamp(1.25rem, 3vw, 2.5rem);
    }

    .ot-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .ot-head-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .ot-logo {
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .ot-status {
      border: none;
      background: none;
      font: inherit;
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      color: var(--subtle);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      transition: color 0.2s;
    }

    .ot-status:hover { color: var(--muted); }
    .ot-status.on { color: var(--accent); }

    .ot-head-right {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .ot-views,
    .ot-types {
      display: flex;
      gap: 0.25rem;
    }

    .ot-views button,
    .ot-types button,
    .ot-close {
      border: 1px solid transparent;
      background: none;
      color: var(--subtle);
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .ot-views button:hover,
    .ot-types button:hover,
    .ot-close:hover {
      color: var(--text);
    }

    .ot-views button.active {
      color: var(--accent);
      border-color: rgba(110, 231, 183, 0.35);
    }

    .ot-close { font-size: 1rem; line-height: 1; padding: 0.15rem 0.55rem; }

    .ot-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(13rem, min(var(--cal-w, 22rem), 45vw)) 0.5rem minmax(0, 1fr);
      gap: 1rem;
      padding-top: 1.75rem;
    }

    .ot-divider {
      width: 0.5rem;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      cursor: col-resize;
      align-self: stretch;
    }

    .ot-divider:hover, .ot-divider.dragging {
      background: rgba(110, 231, 183, 0.4);
    }

    .ot-cal {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .ot-cal-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.875rem;
    }

    .ot-month {
      flex: 1;
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .ot-cal-head button {
      border: 1px solid var(--line);
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.75rem;
      min-width: 1.75rem;
      height: 1.75rem;
      padding: 0 0.5rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s;
    }

    .ot-cal-head button:hover {
      color: var(--accent);
      border-color: rgba(110, 231, 183, 0.35);
    }

    .ot-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(6, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .ot-dow {
      background: var(--bg);
      font-size: 0.625rem;
      letter-spacing: 0.08em;
      color: var(--subtle);
      padding: 0.375rem 0.5rem;
    }

    .ot-cell {
      border: none;
      background: var(--bg);
      font: inherit;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: left;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;
      min-height: 0;
      overflow: hidden;
      transition: color 0.15s, box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ot-cell:hover { color: var(--text); }
    .ot-cell.out { color: rgba(255, 255, 255, 0.15); }
    .ot-cell.out .ot-dots { visibility: hidden; }
    .ot-cell.today .ot-day { color: var(--accent); }
    .ot-cell.sel { box-shadow: inset 0 0 0 1px rgba(110, 231, 183, 0.5); }

    .ot-dots {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .ot-dots i {
      width: 4px;
      height: 4px;
      border-radius: 9999px;
    }

    .ot-main {
      min-height: 0;
      display: flex;
      flex-direction: column;
      container-type: inline-size;
    }

    .ot-list-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .ot-list-title {
      font-size: 0.8125rem;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .ot-count {
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      color: var(--subtle);
    }

    .ot-add {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 0;
      border-bottom: 1px solid var(--line);
    }

    .ot-add input {
      background: none;
      border: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      transition: border-color 0.2s;
    }

    .ot-add input:focus {
      outline: none;
      border-color: rgba(110, 231, 183, 0.35);
    }

    .ot-add input::placeholder { color: var(--subtle); }
    #otTitle { flex: 1 1 12rem; }
    .ot-add input[type="date"],
    .ot-add input[type="time"] { color-scheme: dark; }

    .ot-types button.active[data-type="homework"] { color: #6ee7b7; border-color: rgba(110, 231, 183, 0.3); }
    .ot-types button.active[data-type="school"] { color: #8ab4f8; border-color: rgba(138, 180, 248, 0.3); }
    .ot-types button.active[data-type="event"] { color: #f0a6c8; border-color: rgba(240, 166, 200, 0.3); }
    .ot-types button.active[data-type="task"] { color: #d9c58b; border-color: rgba(217, 197, 139, 0.3); }

    .ot-submit {
      border: 1px solid rgba(110, 231, 183, 0.35);
      background: none;
      color: var(--accent);
      font: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      padding: 0.4rem 0.875rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }

    .ot-submit:hover { border-color: rgba(110, 231, 183, 0.6); }
    .ot-submit:active { transform: scale(0.96); }

    .ot-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0 0.25rem;
      scrollbar-width: thin;
    }

    .ot-group {
      font-size: 0.6875rem;
      letter-spacing: 0.08em;
      color: var(--subtle);
      margin: 1.25rem 0 0.125rem;
    }

    .ot-item {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.75rem 0.25rem;
      border-bottom: 1px solid var(--line);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ot-check {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 1.05rem;
      height: 1.05rem;
      margin: 0.2rem 0 0;
      border: 1px solid var(--subtle);
      border-radius: 9999px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }

    .ot-check:hover { border-color: var(--accent); }
    .ot-check:checked { border-color: rgba(110, 231, 183, 0.6); }

    .ot-check:checked::after {
      content: "";
      position: absolute;
      inset: 0.28rem;
      border-radius: 9999px;
      background: var(--accent);
    }

    .ot-item-main { flex: 1; min-width: 0; }

    .ot-item-title {
      font-size: 0.9375rem;
      color: var(--text);
      cursor: text;
      word-break: break-word;
    }

    .ot-item.done { opacity: 0.45; }
    .ot-item.done .ot-item-title { text-decoration: line-through; }

    .ot-item-meta {
      display: flex;
      gap: 0.625rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
      font-size: 0.6875rem;
      letter-spacing: 0.05em;
      color: var(--subtle);
    }

    .ot-item-meta .late { color: #f87171; }
    .ot-item-meta .type-homework { color: #6ee7b7; }
    .ot-item-meta .type-school { color: #8ab4f8; }
    .ot-item-meta .type-event { color: #f0a6c8; }
    .ot-item-meta .type-task { color: #d9c58b; }

    .ot-notes {
      margin-top: 0.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-word;
    }

    .ot-del {
      border: none;
      background: none;
      color: var(--subtle);
      font: inherit;
      font-size: 1rem;
      line-height: 1;
      padding: 0.25rem 0.375rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }

    .ot-item:hover .ot-del,
    .ot-del:focus-visible { opacity: 1; }
    .ot-del:hover { color: #f87171; }

    @media (hover: none) {
      .ot-del { opacity: 0.55; }
    }

    .ot-edit {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font: inherit;
      font-size: 0.9375rem;
    }

    .ot-edit:focus {
      outline: none;
      border-color: rgba(110, 231, 183, 0.5);
    }

    .ot-empty {
      padding: 1.75rem 0.25rem;
      color: var(--subtle);
      font-size: 0.8125rem;
    }

    .ot-grid.anim .ot-cell {
      animation: otFadeLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      animation-delay: calc(var(--i) * 7ms);
    }

    .ot-list.anim > * {
      animation: otFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      animation-delay: var(--d, 0ms);
    }

    .ot-item.new {
      animation: otPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    .ot-item.removing {
      animation: otRemove 0.16s ease-in forwards;
      pointer-events: none;
    }

    .ot-check.pop {
      animation: otCheckPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ot-badge.pop {
      animation: otBadgePop 0.35s cubic-bezier(0.16, 1, 0.3, 1), pulse 2.4s ease-in-out 0.4s infinite;
    }

    .pill-btn.alert {
      color: var(--accent);
      border-color: rgba(110, 231, 183, 0.35);
    }

    @keyframes otFadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes otFadeLeft {
      from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 12px)); }
      to { opacity: 1; transform: none; }
    }

    @keyframes otPop {
      from { opacity: 0; transform: scale(0.85) translateY(4px); }
      60% { opacity: 1; transform: scale(1.03); }
      to { opacity: 1; transform: none; }
    }

    @keyframes otRemove {
      to { opacity: 0; transform: translateX(10px) scale(0.97); }
    }

    @keyframes otCheckPop {
      40% { transform: scale(1.25); }
    }

    @keyframes otBadgePop {
      from { transform: scale(0); }
      60% { transform: scale(1.18); }
      to { transform: scale(1); }
    }

    @media (max-width: 700px) {
      .ot-body {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        gap: 1.25rem;
        padding-top: 1.25rem;
      }

      .ot-divider {
        display: none;
      }

      .ot-grid {
        grid-template-rows: auto repeat(6, minmax(2.35rem, auto));
        flex: none;
      }

      .ot-list {
        overflow: visible;
        flex: none;
        padding-bottom: 1rem;
      }
    }

    /* tidy add form whenever the task panel is narrow */
    @container (max-width: 26rem) {
      .ot-add {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 0.5rem;
        padding-bottom: 1rem;
      }

      .ot-add input {
        font-size: 1rem; /* keep iOS from zooming the field on focus */
        width: 100%;
      }

      #otTitle {
        flex: none;
        grid-column: 1 / -1;
      }

      .ot-types {
        grid-column: 1 / -1;
        flex-wrap: wrap;
      }

      .ot-submit {
        grid-column: 2;
        justify-self: end;
      }

  <script>
    const canvas = document.getElementById("warp");
    const ctx = canvas.getContext("2d");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const finePointer = matchMedia("(pointer: fine)").matches;
    const SPACING = 34;
    const RADIUS = 170;
    const PUSH = 26;
    let w = 0, h = 0, points = [];
    let mx = -99999, my = -99999, active = false, raf = null;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      points = [];
      for (let y = SPACING / 2; y < h + SPACING; y += SPACING) {
        for (let x = SPACING / 2; x < w + SPACING; x += SPACING) {
          points.push({ ox: x, oy: y, x, y, phase: Math.random() * Math.PI * 2 });
        }
      }
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      for (const p of points) {
        const dx = p.ox - mx;
        const dy = p.oy - my;
        const d = Math.hypot(dx, dy);
        let targetX = p.ox, targetY = p.oy, warp = 0;
        if (active && d < RADIUS && d > 0.001) {
          warp = Math.pow(1 - d / RADIUS, 2);
          const push = PUSH * warp;
          targetX = p.ox + (dx / d) * push;
          targetY = p.oy + (dy / d) * push;
        }
        if (reduced || !finePointer) {
          p.x = targetX;
          p.y = targetY;
        } else if (active) {
          p.x = targetX;
          p.y = targetY;
        } else {
          p.x += (p.ox - p.x) * 0.07;
          p.y += (p.oy - p.y) * 0.07;
        }
        let fx = 0, fy = 0;
        if (!reduced) {
          fx = Math.sin(t * 0.001 + p.phase) * 2.0;
          fy = Math.cos(t * 0.0012 + p.phase) * 2.0;
        }
        const size = 1 + warp * 1.4;
        const alpha = 0.1 + warp * 0.45;
        ctx.fillStyle = warp > 0.02
          ? "rgba(110, 231, 183, " + alpha + ")"
          : "rgba(255, 255, 255, " + alpha + ")";
        ctx.fillRect(p.x + fx - size / 2, p.y + fy - size / 2, size, size);
      }
    }

    function loop(t) {
      draw(t);
      raf = requestAnimationFrame(loop);
    }

    function start() {
      if (reduced || !finePointer) {
        draw(0);
        return;
      }
      addEventListener("pointermove", e => {
        mx = e.clientX;
        my = e.clientY;
        active = true;
        if (raf === null) raf = requestAnimationFrame(loop);
      }, { passive: true });
      document.documentElement.addEventListener("mouseleave", () => {
        active = false;
      });
      addEventListener("resize", () => {
        resize();
        if (raf === null) draw(0);
      });
      raf = requestAnimationFrame(loop);
    }

    resize();
    start();
  </script>

    let drawing = false, last = null;

    function sizeCanvas() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      drawCanvas.width = drawCanvas.clientWidth * dpr;
      drawCanvas.height = drawCanvas.clientHeight * dpr;
      dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dctx.lineWidth = 2;
      dctx.lineCap = "round";
      dctx.lineJoin = "round";
      dctx.strokeStyle = "#6ee7b7";
    }

    function setOpen(open) {
      drawPanel.classList.toggle("open", open);
      drawToggle.classList.toggle("open", open);
      drawToggle.setAttribute("aria-expanded", open);
      drawPanel.setAttribute("aria-hidden", !open);
      if (open) sizeCanvas();
    }

    drawToggle.addEventListener("click", () => {
      setOpen(!drawPanel.classList.contains("open"));
    });

    document.getElementById("drawClose").addEventListener("click", () => setOpen(false));
    document.getElementById("drawClear").addEventListener("click", () => {
      dctx.clearRect(0, 0, drawCanvas.clientWidth, drawCanvas.clientHeight);
    });

    addEventListener("keydown", e => {
      if (e.key === "Escape") setOpen(false);
    });

    drawCanvas.addEventListener("pointerdown", e => {
      drawing = true;
      last = { x: e.offsetX, y: e.offsetY };
      drawCanvas.setPointerCapture(e.pointerId);
    });

    drawCanvas.addEventListener("pointermove", e => {
      if (!drawing) return;
      dctx.beginPath();
      dctx.moveTo(last.x, last.y);
      dctx.lineTo(e.offsetX, e.offsetY);
      dctx.stroke();
      last = { x: e.offsetX, y: e.offsetY };
    });

    drawCanvas.addEventListener("pointerup", () => {
      drawing = false;

  <script>
  (() => {
    // — ontask —
    const API = "https://younes-ontask.woundedmc.workers.dev/ontask/api";
    const LS = { tasks: "ontask.tasks.v1", deleted: "ontask.deleted.v1", dirty: "ontask.dirty.v1", key: "ontask.key.v1", seen: "ontask.seen.v1" };
    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, "0");
    const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    const fromYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const todayY = () => ymd(new Date());
    const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "web-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10));

    // draggable divider: resize the calendar column
    const otBody = document.querySelector(".ot-body");
    const otDivider = $("otDivider");
    const savedCalW = localStorage.getItem("otCalW");
    if (savedCalW) otBody.style.setProperty("--cal-w", savedCalW);
    otDivider.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      otDivider.classList.add("dragging");
      otDivider.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const rect = otBody.getBoundingClientRect();
        const px = Math.max(208, Math.min(ev.clientX - rect.left, rect.width * 0.45));
        otBody.style.setProperty("--cal-w", px + "px");
      };
      const up = () => {
        localStorage.setItem("otCalW", otBody.style.getPropertyValue("--cal-w"));
        otDivider.classList.remove("dragging");
        otDivider.removeEventListener("pointermove", move);
        otDivider.removeEventListener("pointerup", up);
        otDivider.removeEventListener("pointercancel", up);
      };
      otDivider.addEventListener("pointermove", move);
      otDivider.addEventListener("pointerup", up);
      otDivider.addEventListener("pointercancel", up);
    });

    let tasks = load(LS.tasks, []);
    let deleted = load(LS.deleted, {});
    let dirty = load(LS.dirty, {});
    let view = "day";
    let sel = todayY();
    let monthCur = new Date();
    let addType = "task";
    let isOpen = false;
    let syncing = false;
    let syncTimer = null;
    let serverSeen = "";
    let listAnim = false;
    let calAnimDir = 0;
    let lastBadgeCount = -1;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function load(k, fb) {
      try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; }
      catch { return fb; }
    }

    function persist() {
      localStorage.setItem(LS.tasks, JSON.stringify(tasks));
      localStorage.setItem(LS.deleted, JSON.stringify(deleted));
      localStorage.setItem(LS.dirty, JSON.stringify(dirty));
      renderBadge();
    }

    function headers() {
      const h = { "Content-Type": "application/json" };
      const k = localStorage.getItem(LS.key);
      if (k) h["X-Ontask-Key"] = k;
      return h;
    }

    // — state changes —

    function newTask(title, opts) {
      const now = new Date().toISOString();
      return {
        id: uuid(), title, type: opts.type || "task",
        date: opts.date || null, time: opts.time || null, notes: opts.notes || "",
        done: false, source: "web", created_at: now, updated_at: now,
      };
    }

    function pushOne(t) {
      fetch(API + "/tasks", { method: "POST", headers: headers(), body: JSON.stringify(t) })
        .then((r) => { if (r.ok) { delete dirty[t.id]; persist(); } setStatus("local"); })
        .catch(() => setStatus("local"));
    }

    function addTaskLocal(t) {
      tasks.push(t);
      dirty[t.id] = t.updated_at;
      persist();
      render(new Set([t.id]));
      pushOne(t);
    }

    function toggle(t) {
      t.done = !t.done;
      t.updated_at = new Date().toISOString();
      dirty[t.id] = t.updated_at;
      persist();
      renderBadge();
      pushOne(t);
      const li = $("otList").querySelector('.ot-item[data-id="' + t.id + '"]');
      if (li && !reduced) {
        // update in place so the pop plays, then re-render for reordering
        const check = li.querySelector(".ot-check");
        check.checked = t.done;
        check.classList.remove("pop");
        void check.offsetWidth;
        check.classList.add("pop");
        li.classList.toggle("done", t.done);
        setTimeout(() => { if (isOpen) render(); }, 320);
      } else {
        render();
      }
    }

    function saveEdit(t, title) {
      t.title = title;
      t.updated_at = new Date().toISOString();
      dirty[t.id] = t.updated_at;
      persist();
      render();
      pushOne(t);
    }

    function removeTask(t) {
      const finish = () => {
        tasks = tasks.filter((x) => x.id !== t.id);
        deleted[t.id] = Date.now();
        delete dirty[t.id];
        persist();
        render();
        fetch(API + "/tasks/" + t.id, { method: "DELETE", headers: headers() }).catch(() => {});
      };
      const li = $("otList").querySelector('.ot-item[data-id="' + t.id + '"]');
      if (li && !reduced) {
        li.classList.add("removing");
        setTimeout(finish, 160);
      } else {
        finish();
      }
    }

    // — sync —

    async function sync() {
      if (syncing) return;
      syncing = true;
      setStatus("syncing");
      try {
        const res = await fetch(API + "/tasks", { headers: headers(), signal: AbortSignal.timeout(4000) });
        if (!res.ok) throw new Error("api unreachable");
        const data = await res.json();
        if (typeof data.seen === "string" && data.seen > serverSeen) serverSeen = data.seen;
        const remote = Array.isArray(data.tasks) ? data.tasks : [];
        const before = new Set(tasks.map((t) => t.id));
        const map = new Map(tasks.map((t) => [t.id, t]));
        for (const r of remote) {
          if (deleted[r.id]) {
            fetch(API + "/tasks/" + r.id, { method: "DELETE", headers: headers() }).catch(() => {});
            continue;
          }
          const l = map.get(r.id);
          if (!l || String(r.updated_at) > String(l.updated_at)) map.set(r.id, r);
        }
        tasks = [...map.values()];
        for (const t of tasks) {
          if (!dirty[t.id]) continue;
          try {
            const r = await fetch(API + "/tasks", { method: "POST", headers: headers(), body: JSON.stringify(t) });
            if (r.ok) delete dirty[t.id];
          } catch {}
        }
        for (const id of Object.keys(deleted)) if (!remote.some((t) => t.id === id)) delete deleted[id];
        const cutoff = Date.now() - 30 * 864e5;
        for (const [id, ts] of Object.entries(deleted)) if (ts < cutoff) delete deleted[id];
        const arrived = new Set([...map.keys()].filter((id) => !before.has(id)));
        persist();
        render(arrived);
        setStatus("synced");
      } catch {
        setStatus("local");
      }
      syncing = false;
    }

    function setStatus(s) {
      const el = $("otStatus");
      el.textContent = s === "synced" ? "synced" : s === "syncing" ? "syncing…" : "local only";
      el.classList.toggle("on", s === "synced");
    }

    function resetSyncTimer() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(sync, 30000);
    }

    // — rendering —

    function render(newIds) { renderCal(); renderList(newIds); renderBadge(); }

    // the badge counts agent-added, unfinished tasks created after the last time
    // anyone opened the list — global (server "seen") wins over this browser's
    function renderBadge() {
      const local = localStorage.getItem(LS.seen) || "";
      const since = serverSeen > local ? serverSeen : local;
      const n = tasks.filter((t) => t.source === "agent" && !t.done && t.created_at > since).length;
      const b = $("otBadge");
      const btn = $("ontaskToggle");
      b.hidden = n === 0;
      b.textContent = n > 9 ? "9+" : String(n);
      b.classList.toggle("pop", n > 0);
      btn.classList.toggle("alert", n > 0);
      btn.setAttribute("aria-label", n ? "open ontask — " + n + " new" : "open ontask");
      if (n > 0 && n !== lastBadgeCount) {
        b.style.animation = "none";
        void b.offsetWidth;
        b.style.animation = "";
      }
      lastBadgeCount = n;
    }

    function renderCal() {
      const y = monthCur.getFullYear(), m = monthCur.getMonth();
      $("otMonth").textContent = new Date(y, m, 1)
        .toLocaleDateString("en-US", { month: "long", year: "numeric" }).toLowerCase();
      const grid = $("otGrid");
      grid.innerHTML = "";
      grid.classList.toggle("anim", calAnimDir !== 0);
      grid.style.setProperty("--dir", String(calAnimDir || 1));
      calAnimDir = 0;
      for (const d of ["sun", "mon", "tue", "wed", "thu", "fri", "sat"]) {
        const el = document.createElement("div");
        el.className = "ot-dow";
        el.textContent = d;
        grid.appendChild(el);
      }
      const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
      const today = todayY();
      for (let i = 0; i < 42; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const s = ymd(d);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ot-cell" + (d.getMonth() !== m ? " out" : "") + (s === today ? " today" : "") + (s === sel ? " sel" : "");
        btn.style.setProperty("--i", String(i));
        btn.setAttribute("aria-label", d.toDateString());
        const num = document.createElement("span");
        num.className = "ot-day";
        num.textContent = d.getDate();
        btn.appendChild(num);
        const dots = document.createElement("span");
        dots.className = "ot-dots";
        for (const t of tasks.filter((x) => x.date === s && !x.done).slice(0, 4)) {
          const dot = document.createElement("i");
          dot.style.background = { homework: "#6ee7b7", school: "#8ab4f8", event: "#f0a6c8" }[t.type] || "#d9c58b";
          dots.appendChild(dot);
        }
        btn.appendChild(dots);
        btn.addEventListener("click", () => {
          sel = s;
          monthCur = new Date(d.getFullYear(), d.getMonth(), 1);
          if (view !== "day") setView("day");
          else { listAnim = true; render(); }
        });
        grid.appendChild(btn);
      }
    }

    function fmtTime(t) {
      let [h, m] = t.split(":").map(Number);
      const ap = h >= 12 ? "pm" : "am";
      h = h % 12 || 12;
      return h + (m ? ":" + pad(m) : "") + " " + ap;
    }

    function dayTitle(s) {
      if (s === todayY()) return "today";
      const tm = new Date(); tm.setDate(tm.getDate() + 1);
      if (s === ymd(tm)) return "tomorrow";
      return fromYmd(s).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toLowerCase().replace(/,/g, "");
    }

    function itemEl(t) {
      const li = document.createElement("li");
      li.className = "ot-item" + (t.done ? " done" : "");
      li.dataset.id = t.id;
      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "ot-check";
      check.checked = !!t.done;
      check.setAttribute("aria-label", (t.done ? "mark not done: " : "mark done: ") + t.title);
      check.addEventListener("change", () => toggle(t));
      const main = document.createElement("div");
      main.className = "ot-item-main";
      const titleEl = document.createElement("span");
      titleEl.className = "ot-item-title";
      titleEl.textContent = t.title;
      titleEl.title = "click to edit";
      titleEl.addEventListener("click", () => startEdit(li, t));
      main.appendChild(titleEl);
      if (t.notes) {
        const notes = document.createElement("div");
        notes.className = "ot-notes";
        notes.textContent = t.notes;
        main.appendChild(notes);
      }
      const meta = document.createElement("div");
      meta.className = "ot-item-meta";
      if (t.time) { const el = span(""); el.textContent = fmtTime(t.time); meta.appendChild(el); }
      if (t.date && !t.done && t.date < todayY()) {
        const el = span("late"); el.textContent = "overdue"; meta.appendChild(el);
      }
      if (t.type !== "task") { const el = span("type-" + t.type); el.textContent = t.type; meta.appendChild(el); }
      if (t.source === "agent") { const el = span(""); el.textContent = "via agent"; meta.appendChild(el); }
      if (meta.childNodes.length) main.appendChild(meta);
      const del = document.createElement("button");
      del.type = "button";
      del.className = "ot-del";
      del.textContent = "×";
      del.setAttribute("aria-label", "delete: " + t.title);
      del.addEventListener("click", () => removeTask(t));
      li.append(check, main, del);
      return li;
    }

    function span(cls) { const el = document.createElement("span"); if (cls) el.className = cls; return el; }

    function startEdit(li, t) {
      if (li.querySelector(".ot-edit")) return;
      const input = document.createElement("input");
      input.className = "ot-edit";
      input.value = t.title;
      input.maxLength = 500;
      li.querySelector(".ot-item-title").replaceWith(input);
      input.focus();
      input.select();
      let done = false;
      const save = () => {
        if (done) return;
        done = true;
        const v = input.value.trim();
        if (v && v !== t.title) saveEdit(t, v); else render();
      };
      input.addEventListener("blur", save);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { done = true; render(); }
      });
    }

    function sortTasks(list) {
      return list.sort((a, b) =>
        (a.done - b.done) ||
        String(a.time || "99:99").localeCompare(String(b.time || "99:99")) ||
        String(a.created_at).localeCompare(String(b.created_at)));
    }

    function renderList(newIds) {
      const list = $("otList");
      list.innerHTML = "";
      list.classList.toggle("anim", listAnim);
      listAnim = false;
      newIds = newIds || new Set();
      let stagger = 0;
      const d = () => (list.classList.contains("anim") ? Math.min((stagger++) * 22, 400) + "ms" : "0ms");
      const today = todayY();
      if (view === "day") {
        $("otListTitle").textContent = dayTitle(sel);
        const items = sortTasks(tasks.filter((t) => t.date === sel));
        $("otCount").textContent = items.length ? items.filter((t) => !t.done).length + " to do" : "";
        if (!items.length) {
          const empty = document.createElement("li");
          empty.className = "ot-empty";
          empty.textContent = "nothing on this day.";
          empty.style.setProperty("--d", d());
          list.appendChild(empty);
        }
        for (const t of items) {
          const li = itemEl(t);
          li.style.setProperty("--d", d());
          if (newIds.has(t.id)) li.classList.add("new");
          list.appendChild(li);
        }
      } else {
        $("otListTitle").textContent = "upcoming";
        const groups = [];
        const overdue = tasks.filter((t) => !t.done && t.date && t.date < today);
        if (overdue.length) groups.push(["overdue", overdue]);
        for (let i = 0; i <= 30; i++) {
          const d = new Date();
          d.setDate(d.getDate() + i);
          const s = ymd(d);
          const items = sortTasks(tasks.filter((t) => t.date === s));
          if (items.length) groups.push([i === 0 ? "today" : dayTitle(s), items]);
        }
        const undated = tasks.filter((t) => !t.done && !t.date);
        if (undated.length) groups.push(["no date", sortTasks(undated)]);
        if (!groups.length) {
          const empty = document.createElement("li");
          empty.className = "ot-empty";
          empty.textContent = "nothing coming up.";
          empty.style.setProperty("--d", d());
          list.appendChild(empty);
        }
        let toDo = 0;
        for (const [label, items] of groups) {
          const g = document.createElement("li");
          g.className = "ot-group";
          g.textContent = label + (label === "overdue" ? " — " + items.length : "");
          g.style.setProperty("--d", d());
          list.appendChild(g);
          for (const t of items) {
            if (!t.done) toDo++;
            const li = itemEl(t);
            li.style.setProperty("--d", d());
            if (newIds.has(t.id)) li.classList.add("new");
            list.appendChild(li);
          }
        }
        $("otCount").textContent = toDo ? toDo + " to do" : "";
      }
    }

    // — open/close —

    function setOpen(v) {
      if (isOpen === v) return;
      isOpen = v;
      $("otApp").classList.toggle("open", v);
      $("otApp").setAttribute("aria-hidden", String(!v));
      $("ontaskToggle").setAttribute("aria-expanded", String(v));
      document.body.style.overflow = v ? "hidden" : "";
      if (v) {
        // opening the list marks it checked — globally, so badges clear for everyone
        const now = new Date().toISOString();
        localStorage.setItem(LS.seen, now);
        serverSeen = now;
        fetch(API + "/seen", { method: "POST", headers: headers(), body: JSON.stringify({ seen: now }) }).catch(() => {});
        listAnim = true;
        calAnimDir = 1;
        render();
        renderBadge();
        sync();
        resetSyncTimer();
        setTimeout(() => $("otTitle").focus(), 280);
      } else {
        if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
        $("ontaskToggle").focus();
      }
    }

    function closeFromHash() {
      if (location.hash === "#ontask") history.replaceState(null, "", location.pathname + location.search);
      setOpen(false);
    }

    $("ontaskToggle").addEventListener("click", () => {
      if (isOpen) closeFromHash(); else location.hash = "ontask";
    });
    $("otClose").addEventListener("click", closeFromHash);
    addEventListener("hashchange", () => setOpen(location.hash === "#ontask"));
    addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || !isOpen) return;
      const a = document.activeElement;
      if (a && a.classList && a.classList.contains("ot-edit")) return;
      closeFromHash();
    });

    // — controls —

    function setView(v) {
      view = v;
      listAnim = true;
      $("otViews").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
      render();
    }
    $("otViews").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) setView(b.dataset.view);
    });
    $("otTypes").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      addType = b.dataset.type;
      $("otTypes").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    });
    $("otPrev").addEventListener("click", () => {
      monthCur = new Date(monthCur.getFullYear(), monthCur.getMonth() - 1, 1);
      calAnimDir = -1;
      renderCal();
    });
    $("otNext").addEventListener("click", () => {
      monthCur = new Date(monthCur.getFullYear(), monthCur.getMonth() + 1, 1);
      calAnimDir = 1;
      renderCal();
    });
    $("otToday").addEventListener("click", () => {
      monthCur = new Date();
      sel = todayY();
      listAnim = true;
      if (view !== "day") setView("day"); else render();
    });
    $("otStatus").addEventListener("click", sync);

    $("otForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = $("otTitle").value.trim();
      if (!title) return;
      const t = newTask(title, {
        type: addType,
        date: $("otDate").value || (view === "day" ? sel : null),
        time: $("otTime").value || null,
      });
      if (t.date) {
        sel = t.date;
        monthCur = fromYmd(t.date);
      }
      addTaskLocal(t);
      $("otTitle").value = "";
      $("otTime").value = "";
      $("otTitle").focus();
    });

    // — init —
    setStatus("local");
    renderBadge();
    sync(); // pull the shared list on every visit — the badge is live for everyone
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !syncing) sync();
    });
    if (location.hash === "#ontask") setOpen(true);
  })();
  </script>
</body>
</html>
